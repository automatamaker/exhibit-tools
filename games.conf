# exhibit-tools games.conf — 各ゲームの起動方法一覧
# ----------------------------------------------------------------------------
# 各完成機で publish_game.sh を実行すると、そのゲームの行がここに自動登録される。
# 展示機セットアップ(setup.sh)と起動(run_game.sh)はこのファイルを参照する。
#
# 形式:  <ゲーム名(ディレクトリ名)> = <ランチャ>
#   *.sh を指定 … ~/<ゲーム名> で bash 実行する起動スクリプト（スクリプト側が cd/venv/log を持つ）
#   *.py を指定 … ~/<ゲーム名> で venv(あれば .venv/bin/python)優先・無ければ python3 で実行
#
# 例:
#   mohs_code = play_mohs.sh
#   earth_defender = main.py
# ----------------------------------------------------------------------------
deep_earth = play_deep_earth.sh
cloud_buster = play_cloud_buster.sh
aqua_solitaire = play_aqua.sh
gravity_meteor = play_gravity_meteor.sh
ryuhyo_jump = play_ryuhyo.sh
earth_defender = main.py
pinball = play_pinball.sh
mohs_code = play_mohs.sh
